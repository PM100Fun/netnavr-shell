appId: com.netnavr.shell
productName: NetNavr Engineering
artifactName: ${productName}-${version}-${arch}.${ext}
extraMetadata:
  version: 0.1.0-alpha.7
directories:
  output: release
  buildResources: build
files:
  - package.json
  - apps/desktop/dist/**/*
  - apps/web/dist/**/*
  - NOTICE
  - LICENSE
  - "!node_modules/**/*"
  - "!apps/desktop/dist/runtime-check.cjs"
  - "!apps/desktop/dist/runtime-check.cjs.map"
asar: true
# The utility process entry must be a real filesystem file for Electron fork.
asarUnpack:
  - apps/desktop/dist/core-worker.cjs
mac:
  icon: assets/icons/netnavr.icns
  category: public.app-category.developer-tools
  target:
    - target: dir
      arch: [x64]
    - target: dmg
      arch: [x64]
  extendInfo:
    NSHighResolutionCapable: true
    NSRequiresAquaSystemAppearance: false
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
dmg:
  sign: false
  writeUpdateInfo: false
